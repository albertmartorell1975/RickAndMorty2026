<div class="w-full max-w-sm flex flex-col items-center text-center">

<div class="relative w-48 h-48 mb-space-lg flex items-center justify-center">

<circle cx="100" cy="100" r="54" stroke="#D63D2E" stroke-dasharray="18 10 32 8" stroke-width="3"></circle>
<!-- Malfunctioning Core -->
<circle cx="100" cy="100" fill="#151821" r="42"></circle>
<circle cx="100" cy="100" fill="#202428" opacity="0.9" r="38" stroke="#FF9800" stroke-dasharray="4 6" stroke-width="1.5"></circle>

<rect fill="#FF9800" height="8" opacity="0.85" rx="2" width="8" x="156" y="70"></rect>

</div>
</div>
<script>
  function handleRetryAnimation() {
    const icon = document.getElementById('retry-icon');
    const label = document.getElementById('retry-label');
    const button = document.getElementById('retry-button');

    if (!icon || !label || !button) return;

    // Trigger visual spin feedback
    icon.classList.add('rotate-[360deg]');
    label.textContent = 'Reconnecting...';
    button.disabled = true;
    button.classList.add('opacity-80');

    setTimeout(() => {
      icon.classList.remove('rotate-[360deg]');
      label.textContent = 'Retry Connection';
      button.disabled = false;
      button.classList.remove('opacity-80');
    }, 1200);
  }
